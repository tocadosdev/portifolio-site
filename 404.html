<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fcfcfb">
    <!-- Script mínimo antes do CSS; hash correspondente na CSP de vercel.json. -->
    <script>(()=>{let t;try{t=localStorage.getItem('portfolio-theme')}catch{}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#1b2027':'#fcfcfb'})();</script>
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Igor C. Sales</title>
    <!-- Caminhos a partir da raiz funcionam mesmo em URLs inexistentes com várias pastas. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
    <script src="/theme.js" defer></script>
</head>
<body class="not-found-page">
    <header class="not-found-header container">
        <a class="brand" href="/">Igor C. Sales</a>
        <button class="theme-toggle" type="button" aria-label="Ativar modo escuro" aria-pressed="false" hidden>
                        <span class="theme-track" aria-hidden="true"></span>
                        <span class="theme-knob" aria-hidden="true">
                            <svg class="theme-icon theme-sun" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" focusable="false">
                                <circle cx="12" cy="12" r="3.5"/>
                                <g class="theme-sun-rays"><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></g>
                            </svg>
                            <svg class="theme-icon theme-moon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" focusable="false">
                                <path d="M18.3 15.7A7.3 7.3 0 0 1 8.3 5.7a7.5 7.5 0 1 0 10 10Z"/>
                                <g class="theme-stars"><path d="M17 3v4M15 5h4M21 9v2M20 10h2"/></g>
                            </svg>
                        </span>
                    </button>
    </header>
    <main id="conteudo" class="not-found-main container">
        <div class="not-found-card">
            <p class="eyebrow">Um pequeno desvio de caminho</p>
            <p class="not-found-code" aria-hidden="true">404</p>
            <h1>Página não encontrada</h1>
            <p>O endereço pode ter mudado ou a página que você procura ainda não existe. Vamos voltar ao portfólio?</p>
            <div class="hero-actions">
                <a class="button button-primary" href="/">Voltar ao início <span aria-hidden="true">↗</span></a>
                <a class="button button-secondary" href="/#projetos">Ver projetos</a>
            </div>
        </div>
    </main>
    <footer class="not-found-footer container">
        <p>Igor C. Sales · Computação, projetos e aprendizado.</p>
    </footer>
</body>
</html>
